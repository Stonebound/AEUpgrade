// AEUpgrade — modernized build.
//
// Upstream (archived 2018): https://github.com/AppliedEnergistics/AEUpgrade
// The original build (ForgeGradle 1.2-SNAPSHOT / Gradle 1.12 / MC 1.7.2 / AE2 rv0-stable-1,
// drone.io CI) no longer resolves. This buildscript retargets it at MC 1.7.10 + Forge
// 10.13.4.1614 and compiles against AE2 rv3-beta-6 using RetroFuturaGradle. The mod source
// is unchanged from upstream commit 5c102cb apart from one rv0->rv3 API rename.

plugins {
    id "com.gtnewhorizons.retrofuturagradle" version "1.4.9"
}

group = "aeupgrade"
version = "1.7.10-1.0.0"

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(8)
        vendor = JvmVendorSpec.AZUL
    }
}

minecraft {
    mcVersion = "1.7.10"
    // MCP stable 12 is the canonical 1.7.10 mapping set.
    mcpMappingChannel = "stable"
    mcpMappingVersion = "12"
    username = "Developer"

    // AEUpgrade deliberately claims modid "AppliedEnergistics" so AE1 world data binds
    // to its stub blocks/tiles. It also hard-requires the real appliedenergistics2.
    injectedTags.put("VERSION", version)
}

repositories {
    maven {
        name = "CurseMaven"
        url = uri("https://cursemaven.com")
        content { includeGroup "curse.maven" }
    }
    mavenCentral()
}

dependencies {
    // Applied Energistics 2 rv3-beta-6 — CF project 223794, file 2296430.
    // Deobfed so we compile against MCP names.
    implementation(rfg.deobf("curse.maven:applied-energistics-2-223794:2296430"))
}

// Upstream shipped its lang files under assets/appliedenergistics/ (AE1's asset domain).
// Keep that — the stub blocks/items look them up there.
processResources {
    inputs.property "version", project.version
    filesMatching("mcmod.info") {
        expand "version": project.version, "mcversion": "1.7.10"
    }
}

tasks.named("compileJava") {
    // upstream has a few unused imports (appeng.block.AEDecorativeBlock, appeng.tile.AEBaseTile)
    options.compilerArgs << "-Xlint:none"
    options.encoding = "UTF-8"
}
